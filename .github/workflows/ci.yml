name: CampusVoiceBox CI

# Runs on every push and pull request against main.
# It proves both apps pass ESLint, the website's tests pass (frontend/src/
# **/*.test.js[x]), the lists the frontend and backend each keep still match
# (scripts/check-shared-lists.mjs), the API tests pass against a real
# Postgres (backend/test/), the migrations run and the server starts, the
# website builds, and every Docker image - development and production -
# builds cleanly. It stops short of an actual deploy step - add
# that job once hosting is decided, following the commented example at the
# bottom.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend - install, lint, tests, shared lists & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
      # frontend/.env switches ESLint off inside the build, so it runs here
      # instead - any error or warning fails the job.
      - run: npm run lint
      # The website's tests, run once rather than watching for changes as
      # `npm test` does on a developer's machine.
      - run: npm test -- --watchAll=false
        env:
          CI: true
      # The list check loads files from both apps - the website's
      # services/consent.js imports React - so it runs here, where the
      # website's packages already are, with the server's installed beside them.
      - name: Install the backend's packages, for the list check
        working-directory: backend
        run: npm ci
      - name: The lists the frontend and backend both keep still match
        run: node ../scripts/check-shared-lists.mjs
      - run: npm run build --if-present
        env:
          CI: true

  backend:
    name: Backend - lint, API tests & migrate against a real Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cvb_user
          POSTGRES_PASSWORD: cvb_password
          # The API tests wipe their database, so they only run on one whose
          # name ends in _test (backend/test/api.test.js).
          POSTGRES_DB: campusvoicebox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvb_user -d campusvoicebox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: cvb_user
      PGPASSWORD: cvb_password
      PGDATABASE: campusvoicebox_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Run migrations against the CI database
        run: npm run db:migrate
      - name: Boot the server and hit /api/health
        run: |
          npm start &
          npx wait-on http://localhost:4000/api/health -t 15000
          curl -f http://localhost:4000/api/health
      - name: API tests
        run: npm test

  docker-build:
    name: Docker images build cleanly (development and production)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t campusvoicebox-backend ./backend
      - name: Build frontend image
        run: docker build -t campusvoicebox-frontend ./frontend
      - name: Build production backend image
        run: docker build -f backend/Dockerfile.prod -t campusvoicebox-backend-prod ./backend
      - name: Build production website image (nginx)
        run: docker build -f frontend/Dockerfile.prod -t campusvoicebox-web-prod ./frontend

  # --- Deploy stage (skeleton only - fill in once hosting is chosen) ---
  # deploy:
  #   name: Deploy
  #   runs-on: ubuntu-latest
  #   needs: [docker-build]
  #   if: github.ref == 'refs/heads/main'
  #   steps:
  #     - uses: actions/checkout@v4
  #     # Vercel/Netlify (frontend): use their official deploy-action here.
  #     # Docker -> a server: push the production images to a registry,
  #     # then SSH in and `docker compose -f docker-compose.prod.yml up -d`.
