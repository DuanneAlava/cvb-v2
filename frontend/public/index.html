<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a2647" />
    <meta
      name="description"
      content="CampusVoiceBox - a digital suggestion box for students"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- The loading screen's picture, fetched straight away rather than when
         the browser reaches it, so it is there the moment the screen is. -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/splash-logo.png" />
    <title>CampusVoiceBox</title>

    <!--
      THE LOADING SCREEN.

      What a visitor sees while the app's JavaScript is still downloading.
      Without it the page is blank until the bundle arrives - a few seconds
      on a phone over a slow connection - which reads as "broken", not
      "loading".

      It is plain HTML and CSS written straight into this file, on purpose:
      React, Tailwind and every component live INSIDE the bundle that is
      still on its way, so none of them exist yet. Everything here has to
      work without them.

      THE ANIMATION. It is the CampusVoiceBox logo itself - the orange and
      blue hexagonal "C" - with the five bars of its voice waveform rising
      and falling in a wave that runs left to right, like a voice being
      picked up. At rest (for anyone who has asked their device to reduce
      motion) the bars stand exactly as they do in the logo.

      HOW IT IS BUILT. Two layers in one SVG, sharing the logo's own
      937 x 937 grid (the size of the square it was cut from):
        1. splash-logo.png - the logo with its five bars painted out, so
           only the "C" and the white panel inside it are left
        2. the five bars, redrawn on top in the same places, same size and
           same blue gradient, so they can move
      With the bars still, the two layers together ARE the logo.

      HOW EACH BAR MOVES. Each bar is squashed with `transform: scaleY(...)`
      around its own middle (`transform-box: fill-box` makes "center" mean
      the bar's own centre), so it grows up and down equally, the way a
      level meter does. Every bar moves between 35% and 100% of its height
      in the logo and never past it - the outer bars sit close to the
      panel's slanted edges, and a taller bar would poke out into the "C".
      Each bar starts a little later than the one to its left
      (`animation-delay`), which turns five separate bounces into one
      travelling wave.

      HOW IT GOES AWAY. src/index.js fades it out once the app has drawn
      its first screen, then removes it from the page entirely.
    -->
    <style>
      #splash {
        /*
          SIZED TO THE SCREEN. One size, taken from the screen's shorter side,
          drives the tile, the logo, the gaps and the text. A fixed 96px tile
          looked right on a laptop but filled a quarter of a phone's width;
          now it is 64px on a 375px phone, 96px on a tablet, laptop or
          monitor, and small again on a phone turned sideways, where the
          shorter side is the height.

          `vmin` is 1% of whichever is smaller, the width or the height, and
          `clamp(smallest, ideal, largest)` keeps the result between the two
          limits - so it grows with the screen but never past 96px.
        */
        --splash-size: clamp(56px, 17vmin, 96px);
        --splash-gap: clamp(12px, 3.6vmin, 18px);

        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--splash-gap);
        /* The navy the rest of the site is built on, lit softly from the
           middle so the white tile has something to sit in. */
        background: radial-gradient(circle at 50% 45%, #0f4c92 0%, #0a2647 62%);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity 0.35s ease;
      }

      #splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* The white tile, same as the one behind the logo in the navbar -
         it keeps the dark blue of the logo readable on navy. The logo
         fills 84 parts of its 96, close to the navbar's proportion (28px
         in 32), and the corners keep the same rounding at every size. */
      .splash-tile {
        display: grid;
        place-items: center;
        width: var(--splash-size);
        height: var(--splash-size);
        border-radius: calc(var(--splash-size) * 28 / 96);
        background: #fff;
        box-shadow: 0 18px 40px -12px rgba(0, 0, 0, 0.45);
      }

      .splash-tile svg {
        display: block;
        width: calc(var(--splash-size) * 84 / 96);
        height: calc(var(--splash-size) * 84 / 96);
      }

      /* One bar of the waveform - see "HOW EACH BAR MOVES" above. */
      .splash-bar {
        fill: url(#splash-bar-fill);
        transform-box: fill-box;
        transform-origin: center;
        animation: splash-voice 1.1s ease-in-out infinite;
      }

      /*
        The stagger. NEGATIVE delays, so every bar is already partway
        through its cycle the moment the page appears. Positive delays would
        make the later bars stand still until their turn came and then jump
        into the animation - a visible glitch in the first half second. Each
        bar is 0.1s behind the one on its left, which is what makes the wave
        travel left to right.
      */
      .splash-bar:nth-of-type(1) { animation-delay: -0.4s; }
      .splash-bar:nth-of-type(2) { animation-delay: -0.3s; }
      .splash-bar:nth-of-type(3) { animation-delay: -0.2s; }
      .splash-bar:nth-of-type(4) { animation-delay: -0.1s; }
      .splash-bar:nth-of-type(5) { animation-delay: 0s; }

      @keyframes splash-voice {
        0%,
        100% {
          transform: scaleY(0.35);
        }
        50% {
          transform: scaleY(1);
        }
      }

      /* The text shrinks less than the logo, so the name stays easy to read
         on a small phone: 18px on a 375px screen, 22px from a tablet up. */
      .splash-name {
        margin: 0;
        font-size: clamp(17px, 4.8vmin, 22px);
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      /* Pulled up under the name by just over half the gap, at every size. */
      .splash-status {
        margin: calc(var(--splash-gap) * -0.55) 0 0;
        font-size: clamp(12px, 3.4vmin, 13px);
        color: rgba(255, 255, 255, 0.6);
      }

      /* Somebody who has asked their device to reduce motion gets the logo
         standing still, in its normal shape, and the word "Loading". */
      @media (prefers-reduced-motion: reduce) {
        .splash-bar {
          animation: none;
        }
        #splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!--
      role="status" makes a screen reader announce "Loading CampusVoiceBox"
      once, instead of reading out a picture it cannot describe.
    -->
    <div id="splash" role="status" aria-label="Loading CampusVoiceBox">
      <div class="splash-tile" aria-hidden="true">
        <!-- The logo on its own 937-unit grid: first the picture with the
             bars painted out, then the five bars, measured from the original
             logo, drawn back in the same places so they can move. -->
        <svg viewBox="0 0 937 937">
          <defs>
            <!-- The bars' blue: light at the top, deep at the bottom, as in
                 the logo. Each bar runs through the whole gradient. -->
            <linearGradient id="splash-bar-fill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#0096F9" />
              <stop offset="0.5" stop-color="#006FE6" />
              <stop offset="1" stop-color="#0046BD" />
            </linearGradient>
          </defs>
          <image href="%PUBLIC_URL%/splash-logo.png" width="937" height="937" />
          <rect class="splash-bar" x="304.5" y="410" width="56" height="135" rx="28" />
          <rect class="splash-bar" x="387.5" y="345" width="56" height="265" rx="28" />
          <rect class="splash-bar" x="472.5" y="273" width="56" height="404" rx="28" />
          <rect class="splash-bar" x="557.5" y="345" width="56" height="265" rx="28" />
          <rect class="splash-bar" x="641.5" y="410" width="56" height="135" rx="28" />
        </svg>
      </div>
      <p class="splash-name" aria-hidden="true">CampusVoiceBox</p>
      <p class="splash-status" aria-hidden="true">Loading…</p>
    </div>

    <div id="root"></div>
  </body>
</html>
