# The production web server (Dockerfile.prod): the built website as plain
# files, and /api passed on to the backend container.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Do not announce the nginx version on error pages and in headers.
  server_tokens off;

  # A new post can carry up to three photos or PDFs; the backend accepts a
  # body of up to 3 MB (backend/src/app.js), so let that much through.
  client_max_body_size 4m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The API. The backend sets its own security headers. X-Forwarded-For
  # carries the visitor's address on, which the backend reads with
  # TRUST_PROXY (docker-compose.prod.yml) for the rate limits and the
  # activity log.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The built scripts and styles have a fingerprint in their names, so a
  # file never changes once published: the browser may keep it for a year.
  location /static/ {
    expires 1y;
    include /etc/nginx/security-headers.conf;
  }

  # Every other address is a page of the one-page app: hand it index.html,
  # never cached, so a new version of the site is picked up at once.
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
    include /etc/nginx/security-headers.conf;
  }
}
