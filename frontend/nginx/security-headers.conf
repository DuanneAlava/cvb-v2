# Security headers for the website's own files (default.conf). Kept in one
# file because nginx drops headers set further out as soon as a location
# sets any of its own. The API sends its own (backend/src/app.js).

# Never guess a file's type other than the one it is sent as.
add_header X-Content-Type-Options "nosniff" always;
# Never be shown inside somebody else's page.
add_header X-Frame-Options "DENY" always;
# Tell other sites only which site a visitor came from, not which page.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
