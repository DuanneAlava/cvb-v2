# Brings up the whole stack with one command:
#   docker compose up --build
#
# - db:       Postgres 16, with backend/src/models/schema.sql (the tables and
#             the six categories) loaded automatically the first time the
#             volume is created. (schema.sql only runs on an EMPTY volume:
#             after a schema change, `docker compose down -v` wipes the old
#             database first.)
# - backend:  Express API on http://localhost:4000. On its first start it
#             creates the default administrator from ADMIN_EMAIL and
#             ADMIN_PASSWORD - set them in your shell or in a .env file beside
#             this one before `docker compose up` (see GUIDE.md). Signing up
#             on the website only makes student and user accounts.
# - frontend: React dev server on http://localhost:3000
#
# This is a LOCAL/DEV setup (hot reload, no build optimisation). It is not
# meant to be deployed as-is - docker-compose.prod.yml is the production one
# (GUIDE.md, section 3b).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cvb_user
      POSTGRES_PASSWORD: cvb_password
      POSTGRES_DB: campusvoicebox
    ports:
      - "5432:5432"
    volumes:
      - cvb_pg_data:/var/lib/postgresql/data
      - ./backend/src/models/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvb_user -d campusvoicebox"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    # The default administrator (backend/src/config/defaultAdmin.js) and the
    # mail server for "Forgot password?" emails (backend/src/config/mail.js).
    # Not in .env.docker, which is committed: each installation sets its own,
    # in the shell or a .env file beside this one. Without SMTP_HOST, reset
    # emails are printed in the backend's console instead of sent.
    environment:
      - ADMIN_NAME=${ADMIN_NAME:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:4000/api
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  cvb_pg_data:
