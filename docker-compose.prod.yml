# The whole system for real use, built for production:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# What is different from docker-compose.yml (development):
# - web:      nginx serving the BUILT website (frontend/Dockerfile.prod) and
#             passing /api on to the backend - one address, so the browser
#             never needs CORS. The only service reachable from outside, on
#             HTTP_PORT (80 unless set).
# - backend:  only its runtime packages, NODE_ENV=production - which refuses
#             a weak JWT_SECRET - and it brings the database up to date at
#             every start. Reachable only by nginx.
# - db:       Postgres with a password of its own. Reachable only by the
#             backend.
# - Nothing is mounted from this folder: the code is inside the images, so
#   rebuild (--build) after changing it.
#
# Every setting comes from the .env file beside this one - copy
# .env.production.example to .env and fill it in. No secret is written here.
# Without the required ones, compose stops and names the one missing.
# GUIDE.md, "Running it for real", walks through it.

# Its own project name, so its containers and database never mix with the
# development ones started from docker-compose.yml.
name: campusvoicebox-production

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cvb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - see .env.production.example}
      POSTGRES_DB: ${POSTGRES_DB:-campusvoicebox}
    volumes:
      - cvb_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      PORT: 4000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-cvb_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - see .env.production.example}
      PGDATABASE: ${POSTGRES_DB:-campusvoicebox}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env - generate one with openssl rand -hex 32}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      APP_URL: ${APP_URL:?Set APP_URL in .env - the address people open the website at}
      CORS_ORIGIN: ${APP_URL}
      # nginx is one proxy in front of the backend. Add one for every other
      # proxy in front of nginx (a hosting platform's HTTPS, say): 2.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cvb_pg_data:
